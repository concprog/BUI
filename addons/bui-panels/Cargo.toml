[package]
name = "bui-panels"
version = "0.1.0"
edition = "2024"
description = "Panel layouts for BUI's Rust binding (blenderui): docked splits, a stage, tabs, floating panels and navigation"
build = "build.rs"

[dependencies]
blenderui = { path = "../../bindings/rust/blenderui" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[features]
default = ["pinch"]
# trackpad pinch (BUI reports it as Ctrl + wheel, as browsers do) zooms in free navigation
pinch = []

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
inline_always = "allow"
unseparated_literal_suffix = "allow"
similar_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
absolute_paths = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
implicit_hasher = "allow"
float_cmp = "allow"

# nursery
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
redundant_else = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"
derive_partial_eq_without_eq = "warn"

# standalone, like showcase: not a member of bindings/rust's workspace
[workspace]
