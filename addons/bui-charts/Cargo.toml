[package]
name = "bui-charts"
version = "0.1.0"
edition = "2024"
description = "Charts for BUI's Rust binding (blenderui): time series, gauges, heatmaps, flame graphs, traces, node graphs and 80 more"
license = "MIT OR Apache-2.0"

[dependencies]
blenderui = { path = "../../bindings/rust/blenderui" }
bui-charts-macros = { path = "macros" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
nucleo-matcher = "0.3"
regex = "1"
web-time = "1"

[dev-dependencies]
bui-panels = { path = "../bui-panels" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
perf = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
inline_always = "allow"
unseparated_literal_suffix = "allow"
similar_names = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
absolute_paths = "allow"
module_name_repetitions = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
unused_self = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unreadable_literal = "allow"
implicit_hasher = "allow"

# nursery
significant_drop_tightening = "warn"
redundant_clone = "warn"
use_self = "warn"
redundant_else = "warn"
or_fun_call = "warn"
missing_const_for_fn = "warn"
derive_partial_eq_without_eq = "warn"

# standalone, like bui-panels: not a member of bindings/rust's workspace
[workspace]
