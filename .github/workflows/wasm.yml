# A blenderui app in a web page (docs/wasm.md): the kit and blenderui build for wasm32-wasip1 and the
# counter example renders under Node.js. Runs on changes to the WebAssembly parts and by hand.

name: wasm

on:
  push:
    branches: [main]
    paths: ["platform/wasm/**", "bindings/rust/blenderui-web/**", "bindings/rust/blenderui/src/window.rs", "bindings/rust/blenderui-sys/**", "examples/wasm/**", ".github/workflows/wasm.yml"]
  pull_request:
    paths: ["platform/wasm/**", "bindings/rust/blenderui-web/**", "bindings/rust/blenderui/src/window.rs", "bindings/rust/blenderui-sys/**", "examples/wasm/**", ".github/workflows/wasm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter:
    name: the counter builds and renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # wasi-sdk 34's libc++ needs clang 19 (__builtin_clzg); ubuntu-latest's own clang is older
      - name: LLVM 19 (clang with the wasm32 backend, llvm-ar, lld), CMake and Ninja
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-19 main" | sudo tee /etc/apt/sources.list.d/llvm-19.list
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19 lld-19 cmake ninja-build
          echo "WASI_CLANG=/usr/lib/llvm-19/bin" >> "$GITHUB_ENV"
          /usr/lib/llvm-19/bin/clang --version
      - name: The WASI sysroot (cached)
        uses: actions/cache@v4
        with:
          path: ~/.bui/wasi-sysroot
          key: wasi-sysroot-34
      - run: python platform/wasm/build.py --fetch-sysroot
      - name: Build the counter
        run: python platform/wasm/build.py examples/wasm/counter
      - name: It renders, takes a click and resizes
        run: node examples/wasm/smoke.mjs examples/wasm/counter/dist/app.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: counter-web
          path: examples/wasm/counter/dist/
