# A blenderui app in a web page (docs/wasm.md): the kit and blenderui build for wasm32-wasip1 and the
# counter example renders under Node.js. Runs on changes to the WebAssembly parts and by hand.

name: wasm

on:
  push:
    branches: [main]
    paths: ["platform/wasm/**", "bindings/rust/blenderui-web/**", "bindings/rust/blenderui/src/window.rs", "bindings/rust/blenderui-sys/**", "examples/wasm/**", ".github/workflows/wasm.yml"]
  pull_request:
    paths: ["platform/wasm/**", "bindings/rust/blenderui-web/**", "bindings/rust/blenderui/src/window.rs", "bindings/rust/blenderui-sys/**", "examples/wasm/**", ".github/workflows/wasm.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter:
    name: the counter builds and renders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: LLVM (clang with the wasm32 backend, llvm-ar), CMake and Ninja
        run: sudo apt-get install -y clang llvm lld cmake ninja-build
      - name: The WASI sysroot (cached)
        uses: actions/cache@v4
        with:
          path: ~/.bui/wasi-sysroot
          key: wasi-sysroot-34
      - run: python platform/wasm/build.py --fetch-sysroot
      - name: Build the counter
        run: python platform/wasm/build.py examples/wasm/counter
      - name: It renders, takes a click and resizes
        run: node examples/wasm/smoke.mjs examples/wasm/counter/dist/app.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: counter-web
          path: examples/wasm/counter/dist/
